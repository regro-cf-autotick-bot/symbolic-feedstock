schema_version: 1

context:
  name: symbolic
  version: "13.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/symbolic-${{ version }}.tar.gz
    sha256: 3755cf16d3b5d5c2979604717bb480e1d6465f8a751732b5ae0e4d2205009066
  - url: https://raw.githubusercontent.com/getsentry/symbolic/refs/tags/${{ version }}/LICENSE
    sha256: 989aeccdc0127d426c2509116eff70f21b4552f08ebe9f468acc539cd121a692

build:
  # Windows build skipped due to OOM, re-enable on the feedstock
  number: 1
  skip: win
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - unzip rustsrc.zip
    - cd rustsrc
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - milksnake >=0.1.2
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - if: unix
      then: unzip
    - if: win
      then: m2-unzip
  host:
    - python
    - setuptools
    - milksnake >=0.1.2
    - pip
  run:
    - python
    - milksnake >=0.1.2

tests:
  - python:
      imports:
        - symbolic
  - requirements:
      run:
        - pip
    script:
      - pip check

about:
  summary: A python library for dealing with symbol files and more.
  license: MIT
  license_file:
    - LICENSE
    - rustsrc/THIRDPARTY.yml
  homepage: https://github.com/getsentry/symbolic
  repository: https://github.com/getsentry/symbolic

extra:
  recipe-maintainers:
    - xhochy
